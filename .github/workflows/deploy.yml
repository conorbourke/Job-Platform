name: Deploy production

# Builds the OpenNext Worker and deploys it to Cloudflare on every push to
# main (and on demand from the Actions tab). This is independent of the
# Cloudflare <-> GitHub builds integration, so a broken repo connection or a
# Cloudflare-side build failure can't block a deploy.
#
# Repo secret required (Settings -> Secrets and variables -> Actions):
#   CLOUDFLARE_API_TOKEN   API token created from the "Edit Cloudflare Workers"
#                          template in the Cloudflare dashboard.
# Optional:
#   CLOUDFLARE_ACCOUNT_ID  Defaults to the account baked into src/config.ts.
#
# Note: `wrangler deploy` wipes plain-text Worker *Variables*; Worker *Secrets*
# persist. Everything the app needs at runtime is either a Secret or a
# committed fallback in src/config.ts, so this is safe.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# One deploy at a time, in order; never cancel a deploy that's mid-flight.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (OpenNext for Cloudflare)
        run: npx opennextjs-cloudflare build

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || 'eebaaf223ab9ae666f8c5d8461268695' }}
        run: npx wrangler deploy
